---
layout: default
---
<article class="max-w-3xl mx-auto bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700 mt-8">
    <header class="mb-8 border-b border-slate-700 pb-6">
        <h1 class="text-4xl font-bold text-white mb-2">{{ page.title }}</h1>
        <p class="text-sky-400 text-sm font-semibold">{{ page.date | date: "%d %b %Y" }} • Oleh {{ page.author | default: "Apex Wave Editor" }}</p>
    </header>
    <div class="prose prose-invert prose-sky max-w-none text-slate-300 leading-relaxed">
        {{ content }}
    </div>
</article>
<div class="max-w-3xl mx-auto mt-6 text-center">
    <a href="{{ site.baseurl }}/" class="text-sky-400 hover:text-sky-300 transition-colors font-semibold">&larr; Kembali ke Beranda</a>
</div>
